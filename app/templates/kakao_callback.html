<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>카카오 로그인</title>
    <style>
      body { font-family: Arial, sans-serif; max-width: 720px; margin: 48px auto; padding: 0 20px; }
      .ok { color: #116329; }
      .err { color: #b42318; }
    </style>
  </head>
  <body>
    <h1>카카오 로그인</h1>
    {% if success %}
      <p class="ok">{{ message }}</p>
      <p>이 창을 닫고 앱으로 돌아가도 됩니다.</p>
    {% else %}
      <p class="err">{{ message }}</p>
      <p>앱으로 돌아가 다시 시도해 주세요.</p>
    {% endif %}
  </body>
</html>
